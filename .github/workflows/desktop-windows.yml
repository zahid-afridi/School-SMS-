# SchoolSMS — Windows Electron installer (NSIS)
# Self-contained: portable Node + production app/ payload (school PCs need no Node.js).
#
# Version + installer filename come from desktop/package.json (set in this workflow).
# Example: app_version=2.2  →  SchoolSMS_2.2.0_x64-setup.exe  +  release "SchoolSMS 2.2.0"
#
# Triggers:
#   1) Tag push  → version from tag (v2.2.0 → 2.2.0)
#        git tag v2.2.0 && git push origin v2.2.0
#   2) Manual    → Actions → "SchoolSMS Electron Windows" → set App version

name: SchoolSMS Electron Windows

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version for the installer filename (e.g. 2.2 or 2.2.0). Leave empty to auto-bump patch."
        type: string
        default: ""
      create_release:
        description: "Also create/update a GitHub Release and attach the installer"
        type: boolean
        default: true
      prerelease:
        description: "Mark the Release as pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: schoolsms-electron-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Must match OpenWA engines / undici (>=22.19) and portable runtime in prepare-bundle.mjs
  SCHOOL_SMS_BUNDLE_NODE: "22.19.0"

jobs:
  build-electron-windows:
    name: Build Electron NSIS installer
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - name: Setup Python (node-gyp / native modules)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC (native modules)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # Match SCHOOL_SMS_BUNDLE_NODE (undici/OpenWA need >=22.19)
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            OpenWA/package-lock.json
            desktop/package-lock.json

      - name: Install npm dependencies
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
        run: |
          Write-Host "Node $(node -v) / npm $(npm -v)"
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix OpenWA
          # desktop must NOT use an npm lifecycle script named "prepare"
          npm ci --prefix desktop

      - name: Resolve app version
        id: ver
        shell: pwsh
        run: |
          $pkgPath = "desktop/package.json"
          $current = (Get-Content $pkgPath -Raw | ConvertFrom-Json).version

          function Normalize-Semver([string]$raw) {
            $v = $raw.Trim()
            if ($v.StartsWith("v") -or $v.StartsWith("V")) { $v = $v.Substring(1) }

            $pre = $null
            $build = $null
            if ($v.Contains('+')) {
              $bits = $v -split '\+', 2
              $v = $bits[0]
              $build = $bits[1]
            }
            if ($v.Contains('-')) {
              $bits = $v -split '-', 2
              $v = $bits[0]
              $pre = $bits[1]
            }
            if ($v -notmatch '^\d+(\.\d+){0,2}$') {
              throw "Invalid version '$raw'. Use forms like 2.2 or 2.2.0"
            }
            $parts = @($v.Split('.'))
            while ($parts.Count -lt 3) { $parts += '0' }
            $normalized = ($parts[0..2] -join '.')
            if ($pre) { $normalized = "$normalized-$pre" }
            if ($build) { $normalized = "$normalized+$build" }
            return $normalized
          }

          $resolved = $null
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $input = "${{ inputs.app_version }}".Trim()
            if ($input) {
              $resolved = Normalize-Semver $input
              Write-Host "Using workflow input version: $resolved"
            } else {
              $parts = @($current.Split('.')[0..2])
              while ($parts.Count -lt 3) { $parts += '0' }
              $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2] + 1
              $resolved = "$major.$minor.$patch"
              Write-Host "Auto-bumped patch: $current → $resolved"
            }
          } else {
            $tag = "${{ github.ref_name }}"
            $resolved = Normalize-Semver $tag
            Write-Host "Using tag version: $resolved (from $tag)"
          }

          # Update package.json (+ lock) without creating a git tag
          Push-Location desktop
          npm version $resolved --no-git-tag-version --allow-same-version
          Pop-Location

          $check = (Get-Content $pkgPath -Raw | ConvertFrom-Json).version
          if ($check -ne $resolved) {
            throw "Failed to set desktop version (got '$check', expected '$resolved')"
          }

          $tagName = "v$resolved"
          $installerGuess = "SchoolSMS_${resolved}_x64-setup.exe"

          "version=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=SchoolSMS $resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_guess=$installerGuess" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "package.json version → $resolved"
          Write-Host "Installer filename → $installerGuess"
          Write-Host "Release → SchoolSMS $resolved ($tagName)"

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Build backend (production dist)
        working-directory: backend
        run: npm run build

      - name: Build OpenWA
        working-directory: OpenWA
        run: npm run build

      - name: Build frontend (Next standalone)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api
          NEXT_PUBLIC_UPLOAD_BASE_URL: http://127.0.0.1:5000
          NEXT_PUBLIC_BACKEND_PORT: "5000"
        run: npm run build

      - name: Copy Electron splash assets
        working-directory: desktop
        run: npm run prepare:splash

      - name: Prepare production bundle (app/ + portable Node)
        working-directory: desktop
        env:
          SCHOOL_SMS_BUNDLE_NODE: ${{ env.SCHOOL_SMS_BUNDLE_NODE }}
        run: npm run prepare:bundle

      - name: Free disk space before Electron package
        shell: pwsh
        run: |
          if (Test-Path "desktop\.bundle-stage") {
            Remove-Item -Recurse -Force "desktop\.bundle-stage"
          }
          foreach ($p in @(
            "OpenWA\node_modules",
            "frontend\node_modules",
            "backend\node_modules",
            "frontend\.next\cache"
          )) {
            if (Test-Path $p) {
              Write-Host "Removing $p to free disk..."
              Remove-Item -Recurse -Force $p
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Package Electron NSIS installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build

      - name: Collect Electron installer
        id: collect
        shell: pwsh
        run: |
          $releaseDir = "desktop\release"
          $expected = "${{ steps.ver.outputs.installer_guess }}"
          if (!(Test-Path $releaseDir)) {
            throw "Electron release folder missing: $releaseDir"
          }

          $nsis = @()
          if ($expected -and (Test-Path (Join-Path $releaseDir $expected))) {
            $nsis = @(Get-Item (Join-Path $releaseDir $expected))
          } else {
            $nsis = @(Get-ChildItem -Path $releaseDir -Filter "SchoolSMS_*_x64-setup.exe" -ErrorAction SilentlyContinue)
          }
          if ($nsis.Count -eq 0) {
            $nsis = @(Get-ChildItem -Path $releaseDir -Filter "*.exe" -ErrorAction Stop |
              Where-Object { $_.Name -notmatch '(?i)uninstall' -and $_.Name -notmatch '\.blockmap$' })
          }
          if ($nsis.Count -eq 0) {
            Get-ChildItem $releaseDir -Recurse | Format-Table FullName, Length
            throw "No SchoolSMS NSIS .exe found under $releaseDir (expected $expected)"
          }

          $out = "dist-installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $names = @()
          foreach ($f in $nsis) {
            Copy-Item $f.FullName -Destination (Join-Path $out $f.Name) -Force
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "Installer: $($f.Name) ($mb MB)"
            $names += $f.Name
          }
          Get-ChildItem $out | Format-Table Name, Length
          "installer_name=$($names[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=${{ steps.ver.outputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Electron installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSMS-${{ steps.ver.outputs.version }}-Windows-x64
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
          name: ${{ steps.ver.outputs.release_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## SchoolSMS ${{ steps.ver.outputs.version }} — Windows installer (Electron)

            Download **`${{ steps.collect.outputs.installer_name }}`**, run it on Windows 10+, then open **SchoolSMS**.

            - Version: **${{ steps.ver.outputs.version }}**
            - Electron desktop shell + bundled Node (no separate Node install)
            - School database: install folder `data\school.db` (created on first launch)
            - Backup = copy the whole SchoolSMS folder (especially `data\`)
            - First launch unpacks `app\` + `runtime\` once (or again after an upgrade)

            See `BACKUP.txt` inside the install folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          draft: false
          prerelease: ${{ inputs.prerelease == true || inputs.prerelease == 'true' }}
          make_latest: ${{ !(inputs.prerelease == true || inputs.prerelease == 'true') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-installer/*.exe
          body: |
            ## SchoolSMS ${{ steps.ver.outputs.version }} — Windows installer (Electron)

            Download **`${{ steps.collect.outputs.installer_name }}`**, run it on Windows 10+, then open **SchoolSMS**.

            - Version: **${{ steps.ver.outputs.version }}**
            - Electron desktop shell + bundled Node (no separate Node install)
            - School database: install folder `data\school.db` (created on first launch)
            - Backup = copy the whole SchoolSMS folder (especially `data\`)
            - First launch unpacks `app\` + `runtime\` once (or again after an upgrade)

            Built from commit `${{ github.sha }}` via workflow_dispatch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
