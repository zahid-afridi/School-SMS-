# Build a self-contained Windows SchoolSMS installer (NSIS).
# Includes portable Node + production app/ payload — target PCs do not need Node.js.
#
# Triggers:
#   1) Tag push  → builds + creates/updates a GitHub Release with the .exe
#        git tag v1.1.0 && git push origin v1.1.0
#   2) Manual    → builds + uploads artifact; optionally creates a Release
#        Actions → "Desktop Windows Installer" → Run workflow

name: Desktop Windows Installer

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also create/update a GitHub Release and attach the installer"
        type: boolean
        default: true
      release_tag:
        description: "Release tag (e.g. v1.1.0). Required when Create Release is true."
        type: string
        default: "v1.1.0"
      prerelease:
        description: "Mark the Release as pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Must match OpenWA engines / undici (>=22.19) and portable runtime in prepare-bundle.mjs
  SCHOOL_SMS_BUNDLE_NODE: "22.19.0"

jobs:
  build-windows:
    name: Build SchoolSMS NSIS installer
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - name: Setup Python (node-gyp / native modules)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # Match SCHOOL_SMS_BUNDLE_NODE (undici/OpenWA need >=22.19)
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            OpenWA/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          shared-key: schoolsms-desktop-windows

      - name: Install npm dependencies
        shell: pwsh
        env:
          # Help node-gyp find the VS toolchain on windows-latest
          npm_config_msvs_version: "2022"
        run: |
          Write-Host "Node $(node -v) / npm $(npm -v)"
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix OpenWA
          # Note: desktop must NOT use an npm lifecycle script named "prepare"
          # (that auto-runs on ci and broke Prisma before backend scripts were ready).
          npm ci --prefix desktop

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Build backend (production dist)
        working-directory: backend
        run: npm run build

      - name: Build OpenWA
        working-directory: OpenWA
        run: npm run build

      - name: Build frontend (Next standalone)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api
          NEXT_PUBLIC_UPLOAD_BASE_URL: http://127.0.0.1:5000
          NEXT_PUBLIC_BACKEND_PORT: "5000"
        run: npm run build

      - name: Copy splash assets
        working-directory: desktop
        run: npm run prepare:splash

      - name: Prepare production-only bundle (app/ builds)
        working-directory: desktop
        env:
          SCHOOL_SMS_BUNDLE_NODE: ${{ env.SCHOOL_SMS_BUNDLE_NODE }}
        run: npm run prepare:bundle

      - name: Free disk space before Tauri build
        shell: pwsh
        run: |
          # Staging tree is already zipped into resources/ — drop heavy copies
          if (Test-Path "desktop\.bundle-stage") {
            Remove-Item -Recurse -Force "desktop\.bundle-stage"
          }
          # Source node_modules are already baked into app-payload.zip
          foreach ($p in @(
            "OpenWA\node_modules",
            "frontend\node_modules",
            "backend\node_modules",
            "frontend\.next\cache"
          )) {
            if (Test-Path $p) {
              Write-Host "Removing $p to free disk..."
              Remove-Item -Recurse -Force $p
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Tauri build (NSIS)
        working-directory: desktop
        env:
          STATIC_VCRUNTIME: "true"
        run: npm run build

      - name: Collect installer artifacts
        id: collect
        shell: pwsh
        run: |
          $nsisDir = "desktop\src-tauri\target\release\bundle\nsis"
          if (!(Test-Path $nsisDir)) {
            throw "NSIS output folder missing: $nsisDir"
          }
          $nsis = Get-ChildItem -Path $nsisDir -Filter "*.exe" -ErrorAction Stop
          if ($nsis.Count -eq 0) {
            throw "No NSIS .exe found under $nsisDir"
          }
          $out = "dist-installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $names = @()
          foreach ($f in $nsis) {
            Copy-Item $f.FullName -Destination (Join-Path $out $f.Name) -Force
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "Installer: $($f.Name) ($mb MB)"
            $names += $f.Name
          }
          Get-ChildItem $out | Format-Table Name, Length
          "installer_name=$($names[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSMS-Windows-x64
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
          name: SchoolSMS ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## SchoolSMS Windows installer

            Download **`${{ steps.collect.outputs.installer_name }}`**, run it on Windows 10+, then open **SchoolSMS**.

            - Node.js is bundled (no separate Node install)
            - School data lives in the install folder `data\` — backup = copy the whole SchoolSMS folder
            - First launch unpacks the app runtime once (or again after an upgrade)

            See `BACKUP.txt` inside the install folder.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: SchoolSMS ${{ inputs.release_tag }}
          draft: false
          prerelease: ${{ inputs.prerelease == true || inputs.prerelease == 'true' }}
          make_latest: ${{ !(inputs.prerelease == true || inputs.prerelease == 'true') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-installer/*.exe
          body: |
            ## SchoolSMS Windows installer

            Download **`${{ steps.collect.outputs.installer_name }}`**, run it on Windows 10+, then open **SchoolSMS**.

            - Node.js is bundled (no separate Node install)
            - School data lives in the install folder `data\` — backup = copy the whole SchoolSMS folder
            - First launch unpacks the app runtime once (or again after an upgrade)

            Built from commit `${{ github.sha }}` via workflow_dispatch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
