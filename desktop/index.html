<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School SmS</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --bg1: #f0f9ff;
        --bg2: #e2e8f0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #bae6fd 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e2e8f0 0%, transparent 50%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
        padding: 2.25rem 1.75rem;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 18px;
        background: linear-gradient(145deg, #0ea5e9, #0369a1);
        box-shadow: 0 12px 30px rgba(3, 105, 161, 0.28);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
        font-size: 1.35rem;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0;
        font-size: 1.65rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.65rem 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .status {
        margin-top: 1.5rem;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--accent);
        min-height: 1.4em;
      }
      .bar {
        margin: 1.25rem auto 0;
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: rgba(2, 132, 199, 0.15);
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      .error {
        color: #be123c;
        white-space: pre-wrap;
        text-align: left;
        font-size: 0.85rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="mark">SmS</div>
        <h1>School SmS</h1>
        <p>Starting your local school app. Data stays on this computer.</p>
        <div class="bar" id="bar"><span></span></div>
        <div class="status" id="status">Preparing…</div>
        <div class="error" id="error" hidden></div>
      </div>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
